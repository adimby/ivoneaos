name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # Applique les migrations au démarrage ; services inutiles aux tests exclus.
      - run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - name: Numérotation à deux sessions réelles
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          bash scripts/test-db-concurrency.sh
      - name: Types TypeScript à jour
        run: |
          supabase gen types typescript --local --schema public > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"

  # Parcours de bout en bout (e2e/, Playwright) contre une pile Supabase locale. Mailpit
  # reste actif : les codes de connexion et les e-mails de l'application y sont lus.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
      - run: supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor
      # Variables lues par l'application (next build/start) et par e2e/helpers.ts. Pas
      # d'APP_URL : les tests attendent des liens sur l'origine de la requête
      # (127.0.0.1:<port>). Papi, Whop et Resend simulés : playwright.config.ts.
      - name: .env.local pour la pile locale
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          payment_key="$(openssl rand -base64 32)"
          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$payment_key"
          echo "::add-mask::$cron_secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "PAYMENT_SECRETS_KEY=$payment_key"
            echo "CRON_SECRET=$cron_secret"
          } > .env.local
          # Lue par e2e/mailpit.ts et e2e/resend-mock.mjs.
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Rapport et traces Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
